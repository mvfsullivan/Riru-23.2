name: Build Riru v23.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Current Android command-line tools require JDK 17+
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 30 / NDK 21 / CMake 3.10.2
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;android-30" \
            "build-tools;30.0.2" \
            "build-tools;30.0.3" \
            "ndk;21.1.6352462" \
            "cmake;3.10.2.4988404"

      - name: Patch dead Bintray dependencies
        run: |
          sed -i "s|rikka.ndk.thirdparty|dev.rikka.ndk.thirdparty|" riru/build.gradle
          sed -i "s|maven { url 'https://dl.bintray.com/rikkaw/Libraries' }|mavenCentral()|" riru/build.gradle build.gradle

          mkdir -p template/magisk_module
          touch template/magisk_module/.gitattributes

      # Riru v23.2 uses an old Android Gradle Plugin.
      # Use JDK 11 for the actual Gradle build.
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew :riru:assembleRelease --no-daemon

      - name: List build outputs
        run: |
          echo "=== Build outputs ==="
          find . -type f \( -name "*.zip" -o -name "*.apk" -o -name "*.aar" \) -print

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: riru-v23.2-release
          path: out/riru-v23.2-release.zip
          if-no-files-found: error
That's why I added `List build outputs`. If that happens, paste that section of the log and I'll adjust the artifact path.

If everything succeeds, GitHub Actions will give you a downloadable **`riru-v23.2-release` artifact containing the flashable ZIP**.
